<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rédaction d'ordonnances médicales en PDF pour les médecins inscrits au RPPS.">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ordonnancier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabinet sidebar + working column; each prescription renders as an A5/A4 sheet */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --sunken:#E7EEEC; --line:#D3DEDB; --line-strong:#AFC0BB;
  --ink:#12201D; --muted:#566A65; --accent:#0E6B5C; --accent-hover:#0A5649; --on-accent:#FFFFFF; --accent-soft:#DDEFEA;
  --ok:#17744A; --ok-soft:#DFF2E8; --warn:#8A5700; --warn-soft:#FAEFD7; --bad:#B42318; --bad-soft:#FBE5E2;
  --paper:#FFFFFF; --paper-ink:#12201D; --paper-muted:#566A65; --paper-line:#D7DFDD; --paper-tint:#F3F6F5; --paper-accent:#0E6B5C;
  --shadow:0 1px 2px rgba(18,32,29,.06),0 6px 20px rgba(18,32,29,.07);
  --scrim:rgba(18,32,29,.45);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1513; --surface:#14201D; --sunken:#1A2925; --line:#26372F; --line-strong:#38504A;
    --ink:#E3EDEA; --muted:#93A9A3; --accent:#6CD2BC; --accent-hover:#8FE0CF; --on-accent:#0C1513; --accent-soft:#1B3832;
    --ok:#5ACF97; --ok-soft:#15342A; --warn:#EDB453; --warn-soft:#3A2C12; --bad:#FF8B7F; --bad-soft:#3E1D1B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#14201D; --sunken:#1A2925; --line:#26372F; --line-strong:#38504A;
  --ink:#E3EDEA; --muted:#93A9A3; --accent:#6CD2BC; --accent-hover:#8FE0CF; --on-accent:#0C1513; --accent-soft:#1B3832;
  --ok:#5ACF97; --ok-soft:#15342A; --warn:#EDB453; --warn-soft:#3A2C12; --bad:#FF8B7F; --bad-soft:#3E1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;padding-inline:8px}
.brand-mark{width:30px;height:30px;border:2px solid var(--accent);border-radius:7px;position:relative;flex:none}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;background:var(--accent);border-radius:1px}
.brand-mark::before{left:12px;top:6px;width:2px;height:14px}
.brand-mark::after{left:6px;top:12px;width:14px;height:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding-inline:8px;display:flex;gap:8px;align-items:flex-start}
.side-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:6px;flex:none}
.side-foot .dot.local{background:var(--warn)}
main{min-width:0;padding-block:28px 64px;padding-left:32px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wrap.wide{max-width:1560px}
@media (min-width:861px){main{padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media (max-width:860px){
  .shell{display:block}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow:hidden}
  .brand{padding:0}
  .brand span{display:none}
  .nav{flex-direction:row;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding:8px 10px}
  .side-foot{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-block:20px 80px}
  h1{font-size:1.35rem}
}

/* Generic */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.page-head .title{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.soft:hover{border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunken)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner p{margin:0;max-width:72ch}
.banner strong{color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.bad strong{color:var(--bad)}
.note{font-size:.82rem;color:var(--muted);margin:0;max-width:80ch}

/* Fields */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;font-weight:500;color:var(--muted)}
.field small{color:var(--muted);font-size:.76rem}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=search],input:not([type]),select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;line-height:1.35}
textarea{resize:vertical;min-height:38px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.span2{grid-column:span 2}
.span-all{grid-column:1/-1}
@media (max-width:520px){.span2{grid-column:1/-1}}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input,.check-i input{accent-color:var(--accent)}
.check input{margin-top:3px}

/* KPIs & lists */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:500}
.dash-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
@media (max-width:400px){.dash-cols{grid-template-columns:minmax(0,1fr)}}
.mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini-list li{border-top:1px solid var(--line)}
.mini-list li:first-child{border-top:0}
.mini-list button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 6px;border-radius:6px}
.mini-list button:hover{background:var(--sunken)}
.mini-list button:focus-visible{outline:2px solid var(--accent)}
.mini-list .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-list .sub{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-list .meta{font-size:.82rem;color:var(--muted);text-align:right;white-space:nowrap}
.empty-note{color:var(--muted);padding:8px 6px;margin:0}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:36px 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.empty h2{font-size:1.45rem;margin-bottom:8px}
.empty p{margin:0 0 18px;color:var(--muted);max-width:56ch}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.empty ol strong{color:var(--ink);font-weight:600}
@media (max-width:760px){.empty{grid-template-columns:minmax(0,1fr);padding:24px 18px}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{max-width:320px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.list{width:100%;border-collapse:collapse;min-width:680px}
table.list th{text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--sunken);white-space:nowrap}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tbody tr:last-child td{border-bottom:0}
table.list tbody tr[data-act]{cursor:pointer}
table.list tbody tr[data-act]:hover{background:var(--sunken)}
table.list tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.list .r{text-align:right}
table.list .clip{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-empty{padding:28px;text-align:center;color:var(--muted)}

/* Editor */
.editor{display:flex;flex-direction:column;gap:16px}
.ed-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.ed-preview{display:none}
@media (min-width:1240px){
  .ed-layout{grid-template-columns:minmax(0,1fr) minmax(360px,.7fr)}
  .ed-preview{display:block;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;border-radius:8px;background:var(--sunken);border:1px solid var(--line);padding:12px}
  .only-narrow{display:none}
}
.prev-cap{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.ed-preview .paper{margin:0}
.rxline{display:grid;grid-template-columns:28px minmax(0,1fr) 32px;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.rxline:last-child{border-bottom:0}
.rx-num{font-family:var(--f-mono);color:var(--accent);font-weight:500;padding-top:26px;text-align:right}
.rxline.tx .rx-num{padding-top:24px}
.rx-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.g3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:640px){.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3>:first-child{grid-column:1/-1}}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.86rem}
.opts select{width:auto}
.opts .grow{flex:1 1 220px}
.check-i{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.mini{font-size:.8rem;color:var(--muted);font-weight:500}
.l-tools{display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:20px}
.icon-btn{appearance:none;border:0;background:transparent;width:30px;height:26px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:.95rem;line-height:1;display:grid;place-items:center}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn.del{font-size:1.2rem}
.icon-btn.del:hover{background:var(--bad-soft);color:var(--bad)}
.icon-btn:disabled{opacity:.25;cursor:default;background:transparent}
.line-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.line-tools select{width:auto;max-width:100%}
.sticky-actions{position:sticky;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
@media (max-width:760px){.kbd-hint{display:none}}

/* Document view */
.doc-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:1020px){.doc-layout{grid-template-columns:minmax(0,1fr)}.doc-layout .actions{order:-1}}
.actions{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
@media (max-width:1020px){.actions{position:static}}
.actions .btns{display:flex;flex-direction:column;gap:8px}
.actions .btns .btn{justify-content:center}
@media (max-width:1020px){.actions .btns{flex-direction:row;flex-wrap:wrap}}
.facts{display:flex;flex-direction:column;gap:8px;font-size:.88rem;margin:0}
.facts div{display:flex;justify-content:space-between;gap:10px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-weight:500}
.linkish{appearance:none;border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px}

/* Paper */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:3px;box-shadow:var(--shadow);border:1px solid var(--line);margin:0 auto;display:flex;flex-direction:column;gap:16px;font-size:11.5px;line-height:1.45;width:100%;max-width:560px;aspect-ratio:148/210;padding:30px 32px 18px}
.paper.a4{max-width:794px;aspect-ratio:210/297;padding:46px 50px 24px;font-size:12.5px}
.ed-preview .paper.a5{width:560px;max-width:none}
.ed-preview .paper.a4{width:794px;max-width:none}
.paper .p-head{display:flex;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:2px solid var(--paper-accent)}
.paper .p-doc{display:flex;flex-direction:column;gap:1px;color:var(--paper-muted);min-width:0}
.paper .p-doc strong{color:var(--paper-ink);font-size:1.25em;font-family:var(--f-display)}
.paper .p-doc .spe{color:var(--paper-accent);font-weight:600}
.paper .p-ids{text-align:right;color:var(--paper-muted);font-size:.88em;display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.paper .p-ids b{font-family:var(--f-mono);font-weight:500;color:var(--paper-ink)}
.paper .p-date{text-align:right;margin:0}
.paper .p-pat{display:flex;flex-direction:column;gap:1px}
.paper .p-pat strong{font-size:1.1em}
.paper .p-pat span{color:var(--paper-muted)}
.paper .p-title{text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-accent);font-size:.92em;margin:0}
.paper .zone-h{border:1px solid var(--paper-ink);padding:5px 8px;font-size:.82em;font-weight:600;text-align:center;margin:4px 0 2px}
.paper .rx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.paper .rx li.md{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px}
.paper .rx li.md .n{font-weight:700;color:var(--paper-accent)}
.paper .rx li.md strong{font-size:1.06em}
.paper .rx li.md .fl{font-style:italic}
.paper .rx li.tx{white-space:pre-line;padding-left:20px;position:relative}
.paper .rx li.tx::before{content:"–";position:absolute;left:4px;color:var(--paper-accent);font-weight:700}
.paper .rx li.none{color:var(--paper-muted);padding-left:20px}
.paper .p-renew{font-weight:700;margin:0}
.paper .p-notes{margin:0;white-space:pre-line}
.paper .p-sign{margin-top:auto;align-self:flex-end;width:min(220px,60%);min-height:70px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;color:var(--paper-muted);font-size:.86em}
.paper .p-sign img{max-width:100%;max-height:64px;object-fit:contain}
.paper .p-foot{border-top:1px solid var(--paper-line);padding-top:8px;color:var(--paper-muted);font-size:.82em;text-align:center;display:flex;flex-direction:column;gap:1px}
.paper .p-foot b{color:var(--paper-ink)}
.paper .placeholder{color:var(--bad)}
.paper.serif{font-family:Georgia,"Times New Roman",Times,serif}
.paper.serif .p-doc strong{font-family:inherit}
.paper.centre .p-head{flex-direction:column;align-items:center;text-align:center;gap:6px}
.paper.centre .p-doc{align-items:center}
.paper.centre .p-ids{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:2px 14px;text-align:center}
@media (max-width:520px){.paper,.paper.a4{padding:20px 16px 14px;aspect-ratio:auto;min-height:0}.paper .p-head{flex-direction:column}.paper .p-ids{text-align:left}}

/* Settings */
.settings{display:flex;flex-direction:column;gap:16px}
.settings .card h2{margin-bottom:4px}
.settings .card>p{margin:0 0 16px;color:var(--muted);max-width:72ch}
.img-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.img-prev{width:180px;height:70px;border:1px dashed var(--line-strong);border-radius:6px;display:grid;place-items:center;background:#FFFFFF;overflow:hidden;color:#566A65;font-size:.8rem}
.img-prev img{max-width:100%;max-height:100%;object-fit:contain}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.swatch,.seg{position:relative;cursor:pointer}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.swatch input,.seg input{position:absolute;opacity:0;width:1px;height:1px}
.swatch i{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong)}
.swatch input:checked+i{box-shadow:0 0 0 2px var(--ink)}
.swatch input:checked~span{color:var(--ink);font-weight:600}
.swatch input:focus-visible+i,.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.segs{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;width:max-content}

/* ---------- Stockage ---------- */
const S = { settings: { ...DEFAULT_SETTINGS }, patients: [], meds: [], modeles: [], ordos: [], ready: false };
const state = { view: "accueil", ordoId: null, patientId: null, draft: null, isNew: false, dirty: false, q: { ordonnances: "", patients: "", accueil: "" }, modal: false, onConfirm: null, imgDraft: {} };
let backend = null;

const COLS = ["patients", "meds", "modeles", "ordos"];

function localBackend() {
  const KEY = "ordonnancier.v1";
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ settings: S.settings, patients: S.patients, meds: S.meds, modeles: S.modeles, ordos: S.ordos })); } catch (e) {} };
  return {
    mode: "local",
    async start() {
      let m = null; try { m = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
      if (m) { S.settings = { ...DEFAULT_SETTINGS, ...(m.settings || {}) }; COLS.forEach((k) => (S[k] = m[k] || [])); }

    async saveSettings() { persist(); }, async put() { persist(); }, async remove() { persist(); },
  };
}
function dbBackend(db, uid) {
  const root = db.doc(`data/users/${uid}/ordonnancier`);
  const settingsRef = db.doc(`data/users/${uid}/ordo-settings`);
  const cols = Object.fromEntries(COLS.map((k) => [k, root.collection(k)]));
  const onErr = () => toast("La connexion à vos données a été interrompue. Rechargez la page.", true);
  return {
    mode: "db",
    start() {
      return new Promise((resolve) => {
        let pending = COLS.length + 1;
        const wrap = (fn) => { let first = true; return (snap) => { fn(snap); if (first) { first = false; if (--pending === 0) resolve(); } else remoteRender(); }; };
        settingsRef.onSnapshot(wrap((snap) => { S.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) }; }), onErr);
        for (const k of COLS) cols[k].onSnapshot(wrap((snap) => { S[k] = snap.docs.map((d) => ({ ...d.data(), id: d.id })); }), onErr);
      });
    },
    async saveSettings(s) { await settingsRef.set(clone(s)); },
    async put(k, obj) { const { id, ...body } = clone(obj); await cols[k].doc(id).set(body); },
    async remove(k, id) { await cols[k].doc(id).delete(); },
  };
}
let sb = null;
async function fetchAll(make) {
  const out = [];
  for (let from = 0; ; from += 1000) { const { data, error } = await make().range(from, from + 999); if (error) throw error; out.push(...data); if (data.length < 1000) return out; }
}
function supabaseBackend(uid) {
  const now = () => new Date().toISOString();
  return {
    mode: "supabase",
    async start() {
      const [docs, reg] = await Promise.all([fetchAll(() => sb.from("documents").select("collection,id,data").order("id")), sb.from("reglages").select("data").maybeSingle()]);
      if (reg.error) throw reg.error;
      COLS.forEach((k) => (S[k] = []));
      for (const r of docs) if (S[r.collection]) S[r.collection].push({ ...r.data, id: r.id });
      S.settings = { ...DEFAULT_SETTINGS, ...(reg.data?.data || {}) };
    },
    async saveSettings(s) { const { error } = await sb.from("reglages").upsert({ user_id: uid, data: clone(s), updated_at: now() }); if (error) throw error; },
    async put(k, obj) { const { id, ...body } = clone(obj); const { error } = await sb.from("documents").upsert({ user_id: uid, collection: k, id, data: body, updated_at: now() }); if (error) throw error; },
    async remove(k, id) { const { error } = await sb.from("documents").delete().match({ collection: k, id }); if (error) throw error; },
  };
}
function applyProfil() { if (S.profil) S.settings = { ...S.settings, nom: S.profil.nom, prenom: S.profil.prenom, rpps: S.profil.rpps }; }
async function startSession(session) {
  const pr = await sb.from("profils").select("rpps,nom,prenom").maybeSingle();
  if (!pr.error && !pr.data) {
    const adm = await sb.rpc("admin_etat");
    if (adm.data?.admin) { S.admin = adm.data; backend = { mode: "supabase-admin" }; S.ready = true; return; }
  }
  if (pr.error || !pr.data) throw new Error("profil");
  S.profil = pr.data;
  backend = supabaseBackend(session.user.id);
  await backend.start();
  applyProfil();
  S.ready = true;
}
async function initStore() {
  const C = window.ORDO_CONFIG;
  if (C?.supabaseUrl) {
    if (/type=recovery/.test(location.hash)) state.recovery = true;
    sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

    if (/access_token|type=/.test(location.hash)) history.replaceState(null, "", location.pathname);
    if (!data.session) return "auth";
    await startSession(data.session);
    return "ok";
  }
  let db = null, user = null, uid = null;
  if (window.claude?.use) {
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
    if (db && user) { try { uid = await user.id(); } catch (e) {} }

  backend = db && uid ? dbBackend(db, uid) : localBackend();
  await Promise.race([backend.start(), new Promise((r) => setTimeout(r, 15000))]);

}
async function save(k, obj) {

}
async function remove(k, id) {
  S[k] = S[k].filter((x) => x.id !== id);
  try { await backend.remove(k, id); } catch (e) { toast("La suppression a échoué. Réessayez.", true); throw e; }
}
async function saveSettings(s) { if (S.profil) s = { ...s, nom: S.profil.nom, prenom: S.profil.prenom, rpps: S.profil.rpps }; S.settings = s; try { await backend.saveSettings(s); } catch (e) { toast("L’enregistrement a échoué. La signature est peut-être trop lourde.", true); throw e; } }

/* ---------- Métier ---------- */
const getOrdo = (id) => S.ordos.find((o) => o.id === id);
const getPatient = (id) => S.patients.find((p) => p.id === id);
const prescOf = (o) => o.prescripteur || S.settings;

  const os = [...S.ordos].filter((o) => !t || norm(patientName(o.patient || getPatient(o.patientId)) + " " + summary(o)).includes(t)).sort(sortByDate);
  if (!os.length) return `<tr><td colspan="6" class="list-empty">${S.ordos.length ? "Aucune ordonnance ne correspond." : "Aucune ordonnance pour l’instant."}</td></tr>`;
  return os.map((o) => `<tr data-act="open" data-id="${o.id}" tabindex="0"><td class="mono">${fmtDate(o.date)}</td><td><strong>${esc(listName(o.patient || getPatient(o.patientId)))}</strong></td><td>${esc(TYPES[o.type] || "Ordonnance")}</td><td class="clip muted">${esc(summary(o))}</td><td>${o.renouvellement ? `<span class="pill">AR ×${o.renouvellement}</span>` : ""}</td><td class="acts"><button type="button" class="btn sm" data-act="pdf" data-id="${o.id}">PDF</button> <button type="button" class="btn sm" data-act="renew" data-id="${o.id}">Renouveler</button></td></tr>`).join("");
}
function viewOrdos() {
  return `<div class="page-head"><div class="title"><span class="eyebrow">${S.ordos.length} ordonnance${S.ordos.length > 1 ? "s" : ""}</span><h1>Ordonnances</h1></div><button type="button" class="btn primary" data-act="new-ordo">Nouvelle ordonnance</button></div>
  ${setupBanner()}
  <div class="toolbar"><input type="search" class="search" id="q-ordonnances" data-search="ordonnances" placeholder="Patient, médicament, examen…" value="${esc(state.q.ordonnances)}" aria-label="Rechercher une ordonnance"></div>
  <div class="tablewrap"><table class="list"><thead><tr><th>Date</th><th>Patient</th><th>Type</th><th>Contenu</th><th>Renouv.</th><th></th></tr></thead><tbody id="rows">${ordoRows()}</tbody></table></div>`;
}

/* ---------- Patients ---------- */
function patientRows() {
  const q = state.q.patients.trim(), ps = matchPatients(q);
  if (!ps.length) return `<tr><td colspan="5" class="list-empty">${S.patients.length ? `Aucun patient ne correspond. <button type="button" class="linkish" data-act="patient-new" data-prefill="${esc(q)}">Créer « ${esc(q)} »</button>` : "Aucun patient. Ajoutez votre premier patient."}</td></tr>`;
  return ps.map((p) => { const last = ordosOf(p.id)[0]; return `<tr data-act="open-patient" data-id="${p.id}" tabindex="0"><td><strong>${esc(listName(p))}</strong></td><td>${p.naissance ? `${fmtDate(p.naissance)} <span class="muted">(${esc(ageOf(p.naissance))})</span>` : "—"}</td><td>${[p.ald ? '<span class="pill">ALD</span>' : "", p.allergies ? '<span class="pill bad">Allergies</span>' : ""].join(" ")}</td><td class="mono">${last ? fmtDate(last.date) : "—"}</td><td class="r"><button type="button" class="btn sm" data-act="new-ordo" data-patient="${p.id}">Ordonnance</button></td></tr>`; }).join("");
}
function viewPatients() {
  return `<div class="page-head"><div class="title"><span class="eyebrow">${S.patients.length} patient${S.patients.length > 1 ? "s" : ""}</span><h1>Patients</h1></div><button type="button" class="btn primary" data-act="patient-new">Nouveau patient</button></div>
  <div class="toolbar"><input type="search" class="search" id="q-patients" data-search="patients" placeholder="Nom ou prénom…" value="${esc(state.q.patients)}" aria-label="Rechercher un patient"></div>
  <div class="tablewrap"><table class="list"><thead><tr><th>Patient</th><th>Naissance</th><th>Repères</th><th>Dernière ordonnance</th><th></th></tr></thead><tbody id="rows">${patientRows()}</tbody></table></div>`;
}
function viewPatient() {
  const p = getPatient(state.patientId);
  if (!p) return `<p class="muted">Ce patient n’existe plus.</p><div><button type="button" class="btn" data-act="nav" data-view="patients">Retour aux patients</button></div>`;
  const os = ordosOf(p.id);
  const facts = [["Naissance", p.naissance ? `${fmtDate(p.naissance)} (${esc(ageOf(p.naissance))})` : "—"], ["Sexe", p.sexe === "F" ? "Féminin" : p.sexe === "M" ? "Masculin" : "—"], ["Poids", toNum(p.poids) ? num(toNum(p.poids)) + " kg" : "—"], ["ALD", p.ald ? esc(p.aldLibelle || "Oui") : "Non"], ["Téléphone", esc(p.tel || "—")]];
  return `<div class="page-head"><div class="title"><button type="button" class="linkish" data-act="nav" data-view="patients">← Patients</button><h1>${esc(patientName(p))}</h1></div>
    <div class="row"><button type="button" class="btn" data-act="patient-edit" data-id="${p.id}">Modifier la fiche</button>${os.length ? `<button type="button" class="btn" data-act="renew" data-id="${os[0].id}">Renouveler la dernière</button>` : ""}<button type="button" class="btn primary" data-act="new-ordo" data-patient="${p.id}">Nouvelle ordonnance</button></div></div>
  ${p.allergies ? `<div class="banner bad"><p><strong>Allergies et intolérances :</strong> ${esc(p.allergies)}</p></div>` : ""}
  <div class="dash-cols">
    <div class="card"><div class="card-head"><h2>Fiche</h2></div><dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>${p.notes ? `<p class="note" style="margin-top:14px;white-space:pre-line">${esc(p.notes)}</p>` : ""}</div>
    <div class="card"><div class="card-head"><h2>Ordonnances</h2><span class="muted">${os.length}</span></div>${os.length ? `<div style="overflow-x:auto"><table class="list compact"><tbody>${os.map((o) => `<tr data-act="open" data-id="${o.id}" tabindex="0"><td class="mono">${fmtDate(o.date)}</td><td class="clip muted" style="max-width:220px">${esc(summary(o))}</td><td class="acts"><button type="button" class="btn sm" data-act="pdf" data-id="${o.id}">PDF</button> <button type="button" class="btn sm" data-act="renew" data-id="${o.id}">Renouveler</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="empty-note">Aucune ordonnance pour ce patient.</p>`}</div>
  </div>`;
}
function prefillPatient(text) { const w = String(text || "").trim().split(/\s+/).filter(Boolean); return w.length ? { nom: w[0], prenom: w.slice(1).join(" ") } : {}; }
function patientForm(p = {}, inline = false) {
  const f = (name, label, attrs = "", cls = "") => `<label class="field ${cls}"><span>${label}</span><input id="pf-${name}" name="${name}" value="${esc(p[name] ?? "")}" ${attrs}></label>`;
  return `<form data-form="patient" data-id="${p.id || ""}" data-inline="${inline ? 1 : ""}"><div style="display:flex;flex-direction:column;gap:16px">
    <h2>${p.id ? "Modifier la fiche patient" : "Nouveau patient"}</h2>
    <div class="grid">
      ${f("nom", "Nom *", "required")}${f("prenom", "Prénom *", "required")}
      <label class="field"><span>Sexe</span><select id="pf-sexe" name="sexe"><option value="">—</option><option value="F" ${p.sexe === "F" ? "selected" : ""}>Féminin</option><option value="M" ${p.sexe === "M" ? "selected" : ""}>Masculin</option></select></label>
      ${f("naissance", "Date de naissance *", 'type="date" required')}${f("poids", "Poids (kg)", 'type="number" step="0.1" min="0" inputmode="decimal"')}${f("tel", "Téléphone", 'type="tel"')}
      <label class="check span-all"><input type="checkbox" id="pf-ald" name="ald" ${p.ald ? "checked" : ""}><span>Affection de longue durée (ALD) : les nouvelles ordonnances seront bizones par défaut.</span></label>
      ${f("aldLibelle", "Libellé de l’ALD", 'placeholder="ex. Diabète de type 2"', "span-all")}
      <label class="field span-all"><span>Allergies et intolérances</span><textarea id="pf-allergies" name="allergies" rows="2" placeholder="ex. Pénicillines (urticaire)">${esc(p.allergies || "")}</textarea><small>Affichées en alerte pendant la rédaction, jamais imprimées.</small></label>

}

/* ---------- Feuille (aperçu) ---------- */
function paperHTML(o) {
  const P = prescOf(o), p = o.patient || snapPatient(getPatient(o.patientId)) || {}, a4 = P.format === "A4";
  const groups = o.type === "bizone" ? [["ald", ZONE_ALD], ["hors", ZONE_HORS]] : [[null, null]];
  let n = 0;
  const li = (l) => l.kind === "texte"
    ? `<li class="tx">${esc(l.texte) || '<span class="placeholder">Texte vide</span>'}</li>`
    : `<li class="md"><span class="n">${++n}.</span><div><strong>${esc(medTitle(l)) || '<span class="placeholder">Médicament</span>'}</strong>${medLines(l).map((x, i, arr) => `<div class="${/^Non substituable|^Prescription hors AMM/.test(x) ? "fl" : ""}">${esc(x)}</div>`).join("")}</div></li>`;
  const body = groups.map(([z, label]) => { const ls = (o.lignes || []).filter((l) => !z || (l.zone || "ald") === z); return `${label ? `<div class="zone-h">${esc(label)}</div>` : ""}<ol class="rx">${ls.map(li).join("") || (label ? '<li class="none">Néant</li>' : "")}</ol>`; }).join("");
  const ids = [P.rpps ? `RPPS <b>${esc(P.rpps)}</b>` : `<span class="placeholder">RPPS à renseigner</span>`, P.am ? `N° AM <b>${esc(P.am)}</b>` : "", P.finess ? `FINESS <b>${esc(P.finess)}</b>` : ""].filter(Boolean);
  const foot = [P.urgence ? `<b>${esc(P.urgence)}</b>` : "", [P.conventionnement, P.horaires].filter(Boolean).map(esc).join(" · ")].filter(Boolean);
  return `<article class="paper ${a4 ? "a4" : "a5"} ${P.police === "serif" ? "serif" : ""} ${P.disposition === "centre" ? "centre" : ""}" style="--paper-accent:${accentOf(P)}">
    <header class="p-head">
      <div class="p-doc"><strong>${P.nom ? esc(doctorName(P)) : '<span class="placeholder">Votre nom (Paramètres)</span>'}</strong>${P.specialite ? `<span class="spe">${esc(P.specialite)}</span>` : ""}${lines(P.qualifs).map((x) => `<span>${esc(x)}</span>`).join("")}
        ${lines(P.adresse).map((x) => `<span>${esc(x)}</span>`).join("")}${P.cp || P.ville ? `<span>${esc([P.cp, P.ville].filter(Boolean).join(" "))}</span>` : ""}${P.tel ? `<span>Tél. ${esc(P.tel)}</span>` : ""}${P.email ? `<span>${esc(P.email)}</span>` : ""}</div>
      <div class="p-ids">${ids.map((x) => `<span>${x}</span>`).join("")}</div>
    </header>
    <p class="p-date">${o.lieu ? "À " + esc(o.lieu) + ", le " : "Le "}${esc(fmtLong(o.date))}</p>
    <div class="p-pat"><strong>${p.nom ? esc(patientName(p)) : '<span class="placeholder">Patient</span>'}</strong>${patientSub(p, o.date, o.poids) ? `<span>${esc(patientSub(p, o.date, o.poids))}</span>` : ""}</div>
    ${TITLES[o.type] ? `<p class="p-title">${esc(TITLES[o.type])}</p>` : ""}
    ${body}
    ${toNum(o.renouvellement) ? `<p class="p-renew">À renouveler ${toNum(o.renouvellement)} fois.</p>` : ""}
    ${o.mentions ? `<p class="p-notes">${esc(o.mentions)}</p>` : ""}
    <div class="p-sign">${P.signature ? `<img src="${esc(P.signature)}" alt="Signature">` : "<span>Signature</span>"}</div>
    <footer class="p-foot">${foot.map((x) => `<span>${x}</span>`).join("") || "&nbsp;"}</footer>
  </article>`;
}

/* ---------- Éditeur ---------- */
function edLineHTML(l, i, n, bizone, num) {
  const id = (k) => `l${i}-${k}`;
  const zone = bizone ? `<label class="check-i"><span class="mini">Zone</span><select id="${id("zone")}" data-l="zone"><option value="ald" ${l.zone !== "hors" ? "selected" : ""}>ALD</option><option value="hors" ${l.zone === "hors" ? "selected" : ""}>Hors ALD</option></select></label>` : "";
  const tools = `<div class="l-tools">${l.kind !== "texte" ? `<button type="button" class="icon-btn" data-act="fav-line" data-i="${i}" title="Ajouter aux favoris" aria-label="Ajouter ce médicament aux favoris">☆</button>` : ""}<button type="button" class="icon-btn" data-act="dup-line" data-i="${i}" title="Dupliquer" aria-label="Dupliquer la ligne"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg></button><button type="button" class="icon-btn" data-act="move-line" data-i="${i}" data-dir="-1" aria-label="Monter la ligne" title="Monter" ${i === 0 ? "disabled" : ""}>↑</button><button type="button" class="icon-btn" data-act="move-line" data-i="${i}" data-dir="1" aria-label="Descendre la ligne" title="Descendre" ${i === n - 1 ? "disabled" : ""}>↓</button><button type="button" class="icon-btn del" data-act="del-line" data-i="${i}" aria-label="Supprimer la ligne" title="Supprimer">×</button></div>`;
  if (l.kind === "texte") {
    return `<div class="rxline tx" data-i="${i}"><div class="rx-num">–</div><div class="rx-body"><label class="mini" for="${id("texte")}">Texte libre : examens, soins, conseils…</label><textarea id="${id("texte")}" data-l="texte" rows="2" placeholder="ex. NFS, CRP, ionogramme sanguin, créatininémie avec DFG">${esc(l.texte)}</textarea>${zone ? `<div class="opts">${zone}</div>` : ""}</div>${tools}</div>`;
  }
  const f = (k, label, ph, attrs = "") => `<label class="field"><span>${label}</span><input id="${id(k)}" data-l="${k}" value="${esc(l[k])}" placeholder="${ph}" ${attrs}></label>`;
  /* liste de suggestions : favoris, posologies, durées, quantités */
  return `<div class="rxline" data-i="${i}"><div class="rx-num">${num}.</div><div class="rx-body">
    <div class="g3"><div class="field ac"><label class="mini" for="${id("dci")}">Médicament (DCI ou nom commercial) *</label><input id="${id("dci")}" data-l="dci" data-ac="${i}" value="${esc(l.dci)}" placeholder="Tapez 2 lettres : amox, doliprane…" autocomplete="off"><div class="ac-list" id="ac-${i}" hidden></div></div>${f("dosage", "Dosage", "1 g")}${f("forme", "Forme", "comprimé", 'list="formes"')}</div>
    <div class="g3">${f("posologie", "Posologie", "1 comprimé matin et soir", 'list="poso"')}${f("duree", "Durée", "6 jours", 'list="durees"')}${f("quantite", "Quantité", "1 boîte", 'list="qtes"')}</div>
    ${l.posoAuto ? `<p class="hint">Posologie usuelle adulte proposée : vérifiez-la et adaptez-la au patient (âge, poids, fonction rénale, indication).</p>` : ""}
    <div class="opts"><label class="check-i"><input type="checkbox" id="${id("nr")}" data-l="nr" ${l.nr ? "checked" : ""}>Non substituable</label>
      ${l.nr ? `<select id="${id("nrMotif")}" data-l="nrMotif" aria-label="Motif de non-substitution">${Object.entries(NR_MOTIFS).map(([k, v]) => `<option value="${k}" ${(l.nrMotif || "MTE") === k ? "selected" : ""}>${v}</option>`).join("")}</select>` : ""}
      <label class="check-i"><input type="checkbox" id="${id("horsAmm")}" data-l="horsAmm" ${l.horsAmm ? "checked" : ""}>Hors AMM</label>${zone}
      <input class="grow" id="${id("commentaire")}" data-l="commentaire" value="${esc(l.commentaire)}" placeholder="Commentaire (facultatif)" aria-label="Commentaire"></div>
  </div>${tools}</div>`;
}

async function saveFile(filename, data) {

  if (dl) { try { await dl.save({ filename, data }); toast("Fichier enregistré."); } catch (e) { if (e?.code !== "declined") toast("Le téléchargement n’a pas abouti. Réessayez dans un instant.", true); } return; }
  if (window.claude) { toast("Le téléchargement n’est pas disponible dans cette vue. Ouvrez la page dans claude.ai.", true); return; }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const safeName = (s) => String(s).replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim();
function resizeImage(file, maxW, maxH) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, maxW / img.width, maxH / img.height); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL("image/png")); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}

function buildPDF(o) {
  const { jsPDF } = window.jspdf;
  const P = prescOf(o), p = o.patient || snapPatient(getPatient(o.patientId)) || {}, a4 = P.format === "A4";
  const pdf = new jsPDF({ unit: "mm", format: a4 ? "a4" : "a5" });
  const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  const M = a4 ? 18 : 12, R = W - M, CW = R - M, fs = a4 ? 10 : 8.6, lh = fs * 0.43;
  const ACC = hexRgb(accentOf(P)), INK = [18, 32, 29], MUT = [86, 106, 101], LINE = [215, 223, 221], TINT = [243, 246, 245];
  const tx = (s) => String(s ?? "").replace(/[  ]/g, " ");
  const FOOT = 16, F = P.police === "serif" ? "times" : "helvetica", centre = P.disposition === "centre";
  let y = M;
  const ensure = (h) => { if (y + h > H - FOOT - 4) { pdf.addPage(); y = M; } };
  const para = (text, x, w, style = "normal", size = fs, color = INK) => { pdf.setFont(F, style); pdf.setFontSize(size); pdf.setTextColor(...color); const ls = pdf.splitTextToSize(tx(text), w); ensure(ls.length * size * 0.43); pdf.text(ls, x, y + size * 0.35); y += ls.length * size * 0.43; };

  // En-tête prescripteur
  if (centre) {
    let cy = y;
    pdf.setFont(F, "bold"); pdf.setFontSize(fs + 3.5); pdf.setTextColor(...INK);
    pdf.splitTextToSize(tx(doctorName(P) || "Prescripteur"), CW).forEach((x) => { pdf.text(x, W / 2, cy + 4, { align: "center" }); cy += (fs + 3.5) * 0.45; });
    cy += 1.5;
    if (P.specialite) { pdf.setFont(F, "bold"); pdf.setFontSize(fs); pdf.setTextColor(...ACC); pdf.text(tx(P.specialite), W / 2, cy + 2.5, { align: "center" }); cy += lh + 0.6; }
    pdf.setFont(F, "normal"); pdf.setFontSize(fs - 0.6); pdf.setTextColor(...MUT);
    [...lines(P.qualifs), [...lines(P.adresse), [P.cp, P.ville].filter(Boolean).join(" ")].filter(Boolean).join(" · "), [P.tel ? "Tél. " + P.tel : "", P.email].filter(Boolean).join(" · ")].filter(Boolean)
      .forEach((l) => pdf.splitTextToSize(tx(l), CW).forEach((x) => { pdf.text(x, W / 2, cy + 2.5, { align: "center" }); cy += (fs - 0.6) * 0.43; }));
    const ids = [["RPPS", P.rpps], ["N° AM", P.am], ["FINESS", P.finess]].filter(([, v]) => v).map(([k, v]) => `${k} ${v}`).join("   ·   ");
    if (ids) { cy += 1.5; pdf.setFont("courier", "bold"); pdf.setFontSize(fs - 0.8); pdf.setTextColor(...INK); pdf.text(tx(ids), W / 2, cy + 2.5, { align: "center" }); cy += (fs - 0.8) * 0.45; }
    y = cy + 3;
  } else {
    const idW = a4 ? 52 : 44, lw = CW - idW - 4;
    let ly = y;
    pdf.setFont(F, "bold"); pdf.setFontSize(fs + 3.5); pdf.setTextColor(...INK);
    pdf.splitTextToSize(tx(doctorName(P) || "Prescripteur"), lw).forEach((x) => { pdf.text(x, M, ly + 4); ly += (fs + 3.5) * 0.45; });
    ly += 1.5;
    if (P.specialite) { pdf.setFont(F, "bold"); pdf.setFontSize(fs); pdf.setTextColor(...ACC); pdf.text(tx(P.specialite), M, ly + 2.5); ly += lh + 0.6; }
    pdf.setFont(F, "normal"); pdf.setFontSize(fs - 0.6); pdf.setTextColor(...MUT);
    [...lines(P.qualifs), ...lines(P.adresse), [P.cp, P.ville].filter(Boolean).join(" "), P.tel ? "Tél. " + P.tel : "", P.email].filter(Boolean)
      .forEach((l) => pdf.splitTextToSize(tx(l), lw).forEach((x) => { pdf.text(x, M, ly + 2.5); ly += (fs - 0.6) * 0.43; }));
    let ry = y + 2;
    pdf.setFontSize(fs - 0.8);
    [["RPPS", P.rpps], ["N° AM", P.am], ["FINESS", P.finess]].filter(([, v]) => v).forEach(([k, v]) => { pdf.setFont(F, "normal"); pdf.setTextColor(...MUT); pdf.text(k, R - idW, ry + 2.5); pdf.setFont("courier", "bold"); pdf.setTextColor(...INK); pdf.text(tx(v), R, ry + 2.5, { align: "right" }); ry += (fs - 0.8) * 0.5; });
    y = Math.max(ly, ry) + 3;
  }
  pdf.setDrawColor(...ACC); pdf.setLineWidth(0.6); pdf.line(M, y, R, y); pdf.setLineWidth(0.2);
  y += 6;

  // Lieu, date, patient
  pdf.setFont(F, "normal"); pdf.setFontSize(fs); pdf.setTextColor(...INK);
  pdf.text(tx((o.lieu ? `À ${o.lieu}, le ` : "Le ") + fmtLong(o.date)), R, y, { align: "right" });
  y += lh + 3;
  para(patientName(p), M, CW, "bold", fs + 1.5);
  const sub = patientSub(p, o.date, o.poids); if (sub) para(sub, M, CW, "normal", fs, MUT);
  y += 4;
  if (TITLES[o.type]) { pdf.setFont(F, "bold"); pdf.setFontSize(fs); pdf.setTextColor(...ACC); pdf.text(tx(TITLES[o.type].toUpperCase()), W / 2, y + 2, { align: "center" }); y += lh + 4; }

  // Prescriptions
  let n = 0;
  const drawLine = (l) => {
    if (l.kind === "texte") {
      pdf.setFont(F, "normal"); pdf.setFontSize(fs);
      const ls = pdf.splitTextToSize(tx(l.texte), CW - 6); ensure(ls.length * lh + 2);
      pdf.setTextColor(...ACC); pdf.setFont(F, "bold"); pdf.text("-", M + 1, y + fs * 0.35);
      pdf.setFont(F, "normal"); pdf.setTextColor(...INK); pdf.text(ls, M + 6, y + fs * 0.35); y += ls.length * lh + 3; return;
    }
    n++;
    pdf.setFont(F, "bold"); pdf.setFontSize(fs + 0.6);
    const head = pdf.splitTextToSize(tx(medTitle(l)), CW - 6);
    pdf.setFont(F, "normal"); pdf.setFontSize(fs);
    const det = medLines(l).flatMap((x) => pdf.splitTextToSize(tx(x), CW - 6).map((t) => [t, /^Non substituable|^Prescription hors AMM/.test(x)]));
    ensure(head.length * lh + det.length * lh + 3);
    pdf.setFont(F, "bold"); pdf.setFontSize(fs + 0.6); pdf.setTextColor(...ACC); pdf.text(`${n}.`, M, y + fs * 0.35);
    pdf.setTextColor(...INK); pdf.text(head, M + 6, y + fs * 0.35); y += head.length * (fs + 0.6) * 0.43;
    det.forEach(([t, it]) => { pdf.setFont(F, it ? "italic" : "normal"); pdf.setFontSize(fs); pdf.setTextColor(...INK); pdf.text(t, M + 6, y + fs * 0.35); y += lh; });
    y += 3;
  };
  const zoneHead = (label) => {
    pdf.setFont(F, "bold"); pdf.setFontSize(fs - 1);
    const ls = pdf.splitTextToSize(tx(label), CW - 6), h = ls.length * (fs - 1) * 0.43 + 4;
    ensure(h + 8); pdf.setDrawColor(...INK); pdf.setFillColor(...TINT); pdf.rect(M, y, CW, h, "FD");
    pdf.setTextColor(...INK); pdf.text(ls, W / 2, y + 2 + (fs - 1) * 0.35, { align: "center" }); y += h + 4;
  };
  if (o.type === "bizone") {
    [["ald", ZONE_ALD], ["hors", ZONE_HORS]].forEach(([z, label], zi) => {
      if (zi) y += 2;
      zoneHead(label);
      const ls = (o.lignes || []).filter((l) => (l.zone || "ald") === z);
      if (ls.length) ls.forEach(drawLine); else { para("Néant", M + 6, CW - 6, "normal", fs, MUT); y += 3; }
    });
  } else (o.lignes || []).forEach(drawLine);

  if (toNum(o.renouvellement)) { y += 1; para(`À renouveler ${toNum(o.renouvellement)} fois.`, M, CW, "bold", fs); }
  if (o.mentions) { y += 2; para(o.mentions, M, CW, "normal", fs); }

  // Signature
  const sh = a4 ? 26 : 22, sw = a4 ? 60 : 48;
  y += 4; ensure(sh + 4);
  const sy = Math.max(y, H - FOOT - 6 - sh);
  pdf.setFont(F, "normal"); pdf.setFontSize(fs - 1); pdf.setTextColor(...MUT); pdf.text("Signature", R - sw, sy + 2);
  if (P.signature) { try { const ip = pdf.getImageProperties(P.signature); let h = sh - 5, w = (h * ip.width) / ip.height; if (w > sw) { w = sw; h = (w * ip.height) / ip.width; } pdf.addImage(P.signature, "PNG", R - sw, sy + 4, w, h); } catch (e) {} }

  // Pied de page
  const foot = [P.urgence, [P.conventionnement, P.horaires].filter(Boolean).join(" · ")].filter(Boolean), pages = pdf.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    pdf.setPage(i); pdf.setDrawColor(...LINE); pdf.line(M, H - FOOT, R, H - FOOT);
    let fy = H - FOOT + 4;
    foot.forEach((t, j) => { pdf.setFont(F, j ? "normal" : "bold"); pdf.setFontSize(fs - 1.4); pdf.setTextColor(...(j ? MUT : INK)); pdf.text(tx(t), W / 2, fy, { align: "center" }); fy += (fs - 1.4) * 0.45; });
    if (pages > 1) { pdf.setFont(F, "normal"); pdf.setFontSize(fs - 1.6); pdf.setTextColor(...MUT); pdf.text(`${i}/${pages}`, R, H - 5, { align: "right" }); }
  }
  return pdf;
}
async function downloadPDF(o) {
  const probs = settingsProblems();
  if (probs.length && !o.prescripteur) { toast("Avant de télécharger, renseignez " + probs.join(" et ") + " dans Paramètres.", true); return; }
  if (backend?.mode === "supabase") { await downloadServerPDF(o); return; }
  if (!window.jspdf?.jsPDF) { toast("Le générateur PDF n’a pas pu se charger. Vérifiez votre connexion puis rechargez la page.", true); return; }
  let pdf; try { pdf = buildPDF(o); } catch (e) { console.error(e); toast("La création du PDF a échoué.", true); return; }
  const p = o.patient || getPatient(o.patientId) || {};
  await saveFile(safeName(`Ordonnance ${String(p.nom || "").toUpperCase()} ${p.prenom || ""} ${o.date}`) + ".pdf", pdf.output("blob"));
}

async function downloadServerPDF(o) {
  const { data } = await sb.auth.getSession(), tok = data.session?.access_token;
  if (!tok) { renderAuth("login", "Votre session a expiré : reconnectez-vous."); return; }
  toast("Création du PDF…");
  let blob;
  try {
    const C = window.ORDO_CONFIG;
    const r = await fetch(`${C.supabaseUrl}/functions/v1/ordonnance-pdf`, { method: "POST", headers: { Authorization: `Bearer ${tok}`, apikey: C.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify({ id: o.id }) });
    if (!r.ok) { let m = ""; try { m = (await r.json()).error; } catch (e) {} toast(m || "La création du PDF a échoué.", true); return; }
    blob = await r.blob();
  } catch (e) { toast("Le serveur ne répond pas. Vérifiez votre connexion Internet.", true); return; }
  const p = o.patient || getPatient(o.patientId) || {};
  await saveFile(safeName(`Ordonnance ${String(p.nom || "").toUpperCase()} ${p.prenom || ""} ${o.date}`) + ".pdf", blob);
}

function authError(e) {
  const m = String(e?.message || e || "");
  if (/Invalid login credentials/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/banned/i.test(m)) return "Ce compte est suspendu. Contactez l’administrateur de la plateforme.";
  if (/Email not confirmed/i.test(m)) return "Votre adresse e-mail n’est pas encore confirmée : cliquez sur le lien reçu par e-mail.";
  if (/already registered|already exists/i.test(m)) return "Un compte existe déjà avec cette adresse e-mail.";
  if (/rate limit|too many|seconds/i.test(m)) return "Trop de tentatives ou d’e-mails envoyés. Réessayez dans quelques minutes.";
  if (/password/i.test(m) && /weak|short|least|characters/i.test(m)) return "Mot de passe trop faible : au moins 10 caractères, avec lettres et chiffres.";
  if (/RPPS|saving new user/i.test(m)) return "Inscription refusée : le numéro RPPS, le nom ou le prénom ne correspondent pas à un médecin de l’annuaire santé.";
  return "Une erreur est survenue. Vérifiez votre connexion et réessayez.";
}

function bootApp() { $(".side").hidden = false; $(".shell").classList.remove("auth-mode"); render(); }
async function handleAuthForm(kind, form) {
  const fd = new FormData(form), v = (k) => String(fd.get(k) ?? "").trim();
  const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; authMsg("");
  try {
    if (kind === "login") {
      const { data, error } = await sb.auth.signInWithPassword({ email: v("email"), password: String(fd.get("password") || "") });
      if (error) return authMsg(authError(error), true);
      try { await startSession(data.session); } catch (e) { return authMsg("Ce compte n’a pas de profil médecin vérifié.", true); }
      enterApp();
    }
    if (kind === "signup") {
      const rpps = v("rpps").replace(/\s/g, ""), pw = String(fd.get("password") || "");
      if (!/^\d{11}$/.test(rpps)) return authMsg(RPPS_MSG.format, true);
      if (pw.length < 10) return authMsg("Choisissez un mot de passe d’au moins 10 caractères.", true);
      if (pw !== String(fd.get("password2") || "")) return authMsg("Les deux mots de passe ne sont pas identiques.", true);
      const chk = await sb.rpc("verifier_rpps", { p_rpps: rpps, p_nom: v("nom"), p_prenom: v("prenom") });
      if (chk.error) return authMsg(authError(chk.error), true);
      if (chk.data !== "ok") return authMsg(RPPS_MSG[chk.data] || authError(""), true);
      const { data, error } = await sb.auth.signUp({ email: v("email"), password: pw, options: { data: { rpps, nom: v("nom"), prenom: v("prenom") }, emailRedirectTo: location.origin + location.pathname } });
      if (error) return authMsg(authError(error), true);
      if (data.session) { await startSession(data.session); enterApp(); return; }
      renderAuth("login", `Compte créé et RPPS vérifié. Ouvrez l’e-mail de confirmation envoyé à ${v("email")}, cliquez sur le lien, puis connectez-vous.`);
    }
    if (kind === "forgot") {
      const { error } = await sb.auth.resetPasswordForEmail(v("email"), { redirectTo: location.origin + location.pathname });
      if (error) return authMsg(authError(error), true);
      renderAuth("login", "Si un compte existe pour cette adresse, un lien de réinitialisation vient d’être envoyé.");
    }
    if (kind === "recovery") {
      const pw = String(fd.get("password") || "");
      if (pw.length < 10) return authMsg("Choisissez un mot de passe d’au moins 10 caractères.", true);
      if (pw !== String(fd.get("password2") || "")) return authMsg("Les deux mots de passe ne sont pas identiques.", true);
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) return authMsg(authError(error), true);
      state.recovery = false;
      const { data } = await sb.auth.getSession();
      await startSession(data.session); enterApp(); toast("Mot de passe modifié.");
    }
  } catch (e) { console.error(e); authMsg(authError(e), true); }
  finally { if (btn.isConnected) btn.disabled = false; }
}

  try { await saveSettings({ ...d, configured: done ? true : !!S.settings.configured }); } catch (e) { return; }
  if (!done) { renderOnboarding(step + 1); return; }
  state.obDraft = null; toast("Votre espace est prêt."); bootApp();
}

document.addEventListener("click", (e) => {

});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.modal) closeModal();
  if (e.key === "Enter" && e.target.matches("tr[data-act]")) e.target.click();
  const t = e.target, typing = t?.matches?.("input,textarea,select") || t?.isContentEditable;
  if (t?.id === "ed-pq") {
    if (e.key === "Enter") { e.preventDefault(); $("#pickList [data-act]")?.click(); }
    if (e.key === "ArrowDown") { e.preventDefault(); renderPick(); $("#pickList button")?.focus(); }
    if (e.key === "Escape") { $("#pickList").hidden = true; }
  } else if (t?.dataset?.ac !== undefined) {
    const box = document.getElementById(`ac-${t.dataset.ac}`);
    if (e.key === "ArrowDown") { e.preventDefault(); renderAc(+t.dataset.ac); box?.querySelector("button")?.focus(); }
    if (e.key === "Enter" && box && !box.hidden && box.querySelector("button")) { e.preventDefault(); box.querySelector("button").click(); }
    if (e.key === "Escape" && box) box.hidden = true;
  } else if (t?.closest?.("#pickList,.ac-list") && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault(); const n = e.key === "ArrowDown" ? t.nextElementSibling : t.previousElementSibling;
    if (n?.matches("button")) n.focus(); else if (e.key === "ArrowUp") t.closest(".pick-in,.ac")?.querySelector("input")?.focus();
  }
  if ((t?.id === "q-accueil" || t?.id === "q-patients") && e.key === "Enter") { e.preventDefault(); (t.id === "q-accueil" ? $("#home-results [data-act]") : $("#rows [data-act]"))?.click(); }
  if (!state.modal && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if ((e.key === "n" || e.key === "N") && state.view !== "edit") { e.preventDefault(); A["new-ordo"]({ dataset: {} }); }
    else if (e.key === "/") { e.preventDefault(); const s2 = document.querySelector('input[type="search"]'); if (s2) s2.focus(); else { go("accueil"); $("#q-accueil")?.focus(); } }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && state.view === "edit" && !state.modal) { e.preventDefault(); saveDraft(true).catch((err) => console.error(err)); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s" && state.view === "edit" && !state.modal) { e.preventDefault(); saveDraft(false).catch((err) => console.error(err)); }
});

  if (t.id === "sigFile" && t.files?.[0]) { try { state.imgDraft.signature = await resizeImage(t.files[0], 600, 220); keepSettingsForm(); } catch (err) { toast("Cette image n’a pas pu être lue. Essayez un fichier PNG ou JPEG.", true); } return; }
  if (t.id === "importFile" && t.files?.[0]) {
    let data; try { data = JSON.parse(await t.files[0].text()); } catch (err) { toast("Ce fichier n’est pas une sauvegarde valide.", true); return; }
    if (!data || data.app !== "ordonnancier") { toast("Ce fichier n’est pas une sauvegarde Ordonnancier.", true); return; }
    confirmModal("Importer cette sauvegarde ?", `${(data.patients || []).length} patients, ${(data.meds || []).length} favoris, ${(data.modeles || []).length} modèles et ${(data.ordos || []).length} ordonnances. Les éléments portant le même identifiant seront remplacés.`, "Importer", async () => {
      if (data.settings) await saveSettings({ ...DEFAULT_SETTINGS, ...data.settings });
      for (const k of COLS) for (const o of data[k] || []) if (o && o.id) await save(k, o);
      toast("Sauvegarde importée."); go("accueil");
    });
  }
});
document.addEventListener("submit", async (e) => {
  const form = e.target, kind = form.dataset.form; if (!kind) return; e.preventDefault();
  if (["login", "signup", "forgot", "recovery"].includes(kind)) { handleAuthForm(kind, form); return; }
  if (kind === "ob") { submitOnboarding(); return; }
  if (kind === "adm-pass") {
    const af = new FormData(form), pw = String(af.get("password") || "");
    if (pw.length < 12) { toast("Choisissez un mot de passe d’au moins 12 caractères.", true); return; }
    if (pw !== String(af.get("password2") || "")) { toast("Les deux mots de passe ne sont pas identiques.", true); return; }
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) { toast(authError(error), true); return; }
    await sb.rpc("admin_mot_de_passe_change"); S.admin.mdp_a_changer = false; toast("Mot de passe enregistré."); renderAdmin(false); return;
  }
  const fd = new FormData(form), val = (k) => String(fd.get(k) ?? "").trim();
  if (kind === "patient") {
    const old = getPatient(form.dataset.id) || { id: newId(), createdAt: new Date().toISOString() };
    const p = { ...clone(old), nom: val("nom"), prenom: val("prenom"), sexe: val("sexe"), naissance: val("naissance"), poids: val("poids"), tel: val("tel"), ald: !!form.querySelector("#pf-ald")?.checked, aldLibelle: val("aldLibelle"), allergies: val("allergies"), notes: val("notes") };
    if (!p.nom || !p.prenom || !p.naissance) { toast("Le nom, le prénom et la date de naissance sont nécessaires.", true); return; }
    await save("patients", p); closeModal(); toast("Patient enregistré.");
    if (form.dataset.inline && state.view === "edit") choosePatient(p);
    else if (!form.dataset.id) go("patient", { patientId: p.id }); else render();
  }
  if (kind === "med") {
    const old = S.meds.find((x) => x.id === form.dataset.id) || { id: newId() };
    const m = { ...clone(old), dci: val("dci"), dosage: val("dosage"), forme: val("forme"), posologie: val("posologie"), duree: val("duree"), quantite: val("quantite") };
    if (!m.dci) { toast("Indiquez le médicament.", true); return; }
    await save("meds", m); closeModal(); toast("Favori enregistré."); render();
  }
  if (kind === "modele-new") {
    const o = getOrdo(form.dataset.id), nom = val("nom"); if (!nom) return;
    const old = S.modeles.find((m) => (m.nom || "").toLowerCase() === nom.toLowerCase());
    await save("modeles", { id: old?.id || newId(), nom, type: o.type, lignes: clone(o.lignes), mentions: o.mentions || "" });
    closeModal(); toast(old ? "Modèle mis à jour." : "Modèle enregistré.");
  }
  if (kind === "modele") { const m = clone(S.modeles.find((x) => x.id === form.dataset.id)); m.nom = val("nom") || m.nom; await save("modeles", m); closeModal(); toast("Modèle renommé."); render(); }
  if (kind === "settings") {
    const s = { ...S.settings, ...settingsFromForm(form) };
    if (state.imgDraft.signature !== undefined) s.signature = state.imgDraft.signature;
    await saveSettings(s); state.imgDraft = {}; toast("Paramètres enregistrés."); render();
  }
});

document.addEventListener("focusin", (e) => { if (e.target.id === "ed-pq") renderPick(); if (e.target.dataset?.ac !== undefined) renderAc(+e.target.dataset.ac); });
document.addEventListener("mousedown", (e) => { if (e.target.closest?.("#pickList,.ac-list")) e.preventDefault(); });
document.addEventListener("focusout", () => setTimeout(() => { document.querySelectorAll("#pickList,.ac-list").forEach((box) => { if (!box.parentElement.contains(document.activeElement)) box.hidden = true; }); }, 150));

/* ---------- Démarrage ---------- */
(async () => {
  const h = location.hash.slice(1); if (TABS.includes(h)) state.view = h;
  let r;
  try { r = await initStore(); } catch (e) { console.error(e); $("#main").innerHTML = `<div class="loading">Le service est momentanément indisponible. Rechargez la page dans un instant.</div>`; return; }
  if (r === "auth" || state.recovery) renderAuth(state.recovery ? "recovery" : "login"); else if (S.admin) renderAdmin(); else if (needsOnboarding()) renderOnboarding(1); else render();
})();
</script>
